[project]
name = "swto-core"
version = "0.1.0"
description = "Shared Summoners War Team Optimizer core logic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10",
  "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
